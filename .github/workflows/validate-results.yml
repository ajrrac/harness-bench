name: Validate results
on:
  pull_request:
    paths: ["results/**", "tasks.txt", "scripts/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.*
      - run: python scripts/validate_results.py
      - name: Site builds
        run: python scripts/build_site.py
